name: Guardian V6.0 complete offline package ceremony
on:
  push:
    paths:
      - scripts/GuardianV60-PrepareOfflineBundle.mjs
      - scripts/GuardianV60-SignPreparedBundle.mjs
      - scripts/GuardianV60-SignedBundleTrust.mjs
      - scripts/test-GuardianV60-EndToEnd.mjs
      - .github/workflows/guardian-v60-integrated-ceremony.yml
  pull_request:
    paths:
      - scripts/GuardianV60-PrepareOfflineBundle.mjs
      - scripts/GuardianV60-SignPreparedBundle.mjs
      - scripts/GuardianV60-SignedBundleTrust.mjs
      - scripts/test-GuardianV60-EndToEnd.mjs
      - .github/workflows/guardian-v60-integrated-ceremony.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-sign-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Execute complete offline manual bundle creation and detached signing regression
        shell: pwsh
        run: |
          node scripts/test-GuardianV60-EndToEnd.mjs
          if($LASTEXITCODE -ne 0){throw 'Integrated V60 ceremony failed'}
          Write-Output 'V60_FULL_INTEGRATED_OFFLINE_BACKUP_CEREMONY=PASS'

name: Guardian V5.4 operator safe Windows regression
on:
  push:
    paths:
      - scripts/Invoke-GuardianV54-Catalog.ps1
      - scripts/GuardianV54-ArchiveCatalog.mjs
      - .github/workflows/guardian-v54-windows-operator.yml
  pull_request:
    paths:
      - scripts/Invoke-GuardianV54-Catalog.ps1
      - scripts/GuardianV54-ArchiveCatalog.mjs
      - .github/workflows/guardian-v54-windows-operator.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-operator:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PS1 and refuse unauthorized catalog access with sanitized output
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tok=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/Invoke-GuardianV54-Catalog.ps1),[ref]$tok,[ref]$errors)
          if($errors.Count){throw 'PowerShell parser failed'}
          $dir=Join-Path $env:RUNNER_TEMP 'r62-v54-synthetic'
          New-Item -ItemType Directory -Path $dir -Force|Out-Null
          $archive=Join-Path $dir 'synthetic.r62db'
          [IO.File]::WriteAllBytes($archive,[Text.Encoding]::ASCII.GetBytes('R62DB02_NOT_REAL_ENCRYPTION'+('TEST'*40)))
          $sha=(Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          $result=@(& ./scripts/Invoke-GuardianV54-Catalog.ps1 -ExpectedSha256 $sha -SearchRoots @($dir) -NoClipboard)
          $report=$result -join [Environment]::NewLine
          if($report -notmatch 'MATCHING_CIPHERTEXT_COPIES=1'){throw 'Archive discovery failed'}
          if($report -notmatch 'STATUS=BLOCKED_REDACTED'){throw 'Malformed synthetic must fail closed'}
          if($LASTEXITCODE -ne 2){throw 'Blocked operator must return exit code 2'}
          if($report -match 'TOC_PROCESS_EXIT=SUCCESS'){throw 'Blocked operator must not claim success'}
          if($report -notmatch 'NO_SQL_EXECUTED=YES'){throw 'Dangerous operations detected'}
          $global:LASTEXITCODE=0
          Write-Output 'V54_WINDOWS_ONE_ENTER_SYNTHETIC_FAIL_CLOSED=PASS'

name: Guardian V5.5 authenticated recovery preflight no-write CI
on:
  push:
    paths:
      - scripts/GuardianV55-RecoveryPreflight.mjs
      - scripts/test-GuardianV55-RecoveryPreflight.mjs
      - .github/workflows/guardian-v55-readiness.yml
  pull_request:
    paths:
      - scripts/GuardianV55-RecoveryPreflight.mjs
      - scripts/test-GuardianV55-RecoveryPreflight.mjs
      - .github/workflows/guardian-v55-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-fail-closed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify report parser, mismatched table scope, privilege gates and invalid tampered reports
        shell: pwsh
        run: |
          node --check scripts/GuardianV55-RecoveryPreflight.mjs
          if($LASTEXITCODE -ne 0){throw 'Node parser failed'}
          node scripts/test-GuardianV55-RecoveryPreflight.mjs
          if($LASTEXITCODE -ne 0){throw 'Readiness fixture failed'}
          $out=@(node scripts/GuardianV55-RecoveryPreflight.mjs --safe-report missing)
          if($LASTEXITCODE -ne 2 -or ($out -join ' ') -notmatch 'STATUS=BLOCKED_USAGE'){throw 'Unsafe CLI did not block'}
          $global:LASTEXITCODE=0
          Write-Output 'V55_OFFLINE_FAIL_CLOSED=PASS'

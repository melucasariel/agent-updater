name: CLEAN6 readiness script static checks
on:
  push:
    paths:
      - 'scripts/Test-Clean6Readiness.ps1'
      - '.github/workflows/clean6-readiness.yml'
  pull_request:
    paths:
      - 'scripts/Test-Clean6Readiness.ps1'
      - '.github/workflows/clean6-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-readonly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell syntax and read-only smoke test
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/Test-Clean6Readiness.ps1),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){throw 'Readiness script parse failure'}
          $report=@(& ./scripts/Test-Clean6Readiness.ps1 -AuditScriptPath (Join-Path $env:RUNNER_TEMP 'nonexistent-audit.mjs'))
          if(($report -join "`n") -notmatch 'AUDIT_SCRIPT_AT_REQUESTED_PATH=False' -or ($report -join "`n") -notmatch 'SEMANTIC_AUDIT_NOT_EXECUTED=YES' -or ($report -join "`n") -notmatch 'DATABASE_UNTOUCHED=YES'){throw 'Read-only contract failed'}
